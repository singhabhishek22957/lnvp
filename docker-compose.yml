
services:
  lnvp_school:
    build:
      context: ./lnvp_school
      dockerfile: Dockerfile
    container_name: lnvp_school
    ports:
      - "3000:3000"
    volumes:
      - ./lnvp_school:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: npm run dev
    restart: unless-stopped
